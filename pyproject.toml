[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diploid-agent"
version = "0.5.0"
description = "Persistent ACP agent harness with pluggable state"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
plugins = [
    "diploid-plugins>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.20",
]

[project.urls]
Homepage = "https://github.com/emiltsoi/diploid-agent"
Repository = "https://github.com/emiltsoi/diploid-agent.git"
Issues = "https://github.com/emiltsoi/diploid-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-m", "not slow"]
markers = [
    "slow: tests that exercise real external binaries or APIs",
]

[tool.ruff]
line-length = 100
target-version = "py312"
